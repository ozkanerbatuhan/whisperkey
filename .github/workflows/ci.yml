name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The GUI, audio and CUDA layers are not importable on a runner, so the
      # tested modules (states, hotkeys, sounds) are deliberately dependency
      # free. Only what they need gets installed.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest ruff keyboard

      - name: Lint
        run: ruff check src tests tools

      - name: Test
        run: python -m pytest tests -q
