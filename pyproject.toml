[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperkey"
version = "0.1.0"
description = "Hold a key, talk, and the text lands in whatever window you are in. Local, offline, free."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Batuhan Özkaner", email = "ozkanerbatuhan@gmail.com" }]
keywords = ["whisper", "speech-to-text", "dictation", "push-to-talk", "offline", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "numpy>=1.26",
    "keyboard>=0.13.5",
    "pystray>=0.19",
    "Pillow>=10",
]

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]
tts = ["piper-tts>=1.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/ozkanerbatuhan/whisperkey"
Issues = "https://github.com/ozkanerbatuhan/whisperkey/issues"

[project.scripts]
whisperkey = "whisperkey.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whisperkey = ["assets/sounds/*.wav", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
